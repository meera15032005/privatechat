name: Build PrivateChat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -o PrivateChat_GitHub_Project.zip -d project

      - name: Add Firebase config
        run: |
          mkdir -p project/app
          cat > project/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "353423906414",
              "project_id": "parentguard-bc22c",
              "storage_bucket": "parentguard-bc22c.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:353423906414:android:94414d81b832b3f79fb87f",
                  "android_client_info": {
                    "package_name": "com.example.privatechat"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyA6IyT2yncI5jDzLaOTHGkFiN_ls_VvkXM"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrivateChat-debug-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
